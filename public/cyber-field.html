<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cyber field</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 13);
const root = new THREE.Group();
// 球体偏右下，给左侧标题/正文留出干净空间
root.position.set((innerWidth<760?1.2:4.6), -1.4, -1.5);
scene.add(root);

// 圆形发光贴图
function dot(){
  const t=document.createElement('canvas'); t.width=t.height=64;
  const x=t.getContext('2d'); const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.4,'rgba(160,250,255,.7)'); g.addColorStop(1,'rgba(0,240,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(t);
}
const sprite = dot();
const mobile = innerWidth < 760;

// ① 中心粒子球
const N1 = mobile ? 5000 : 11000;
const p1 = new Float32Array(N1*3), s1 = new Float32Array(N1);
const gA = Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N1;i++){
  const y=1-(i/(N1-1))*2, r=Math.sqrt(1-y*y), th=gA*i, rad=3.4+(Math.random()-.5)*.8;
  p1[i*3]=Math.cos(th)*r*rad; p1[i*3+1]=y*rad; p1[i*3+2]=Math.sin(th)*r*rad;
  s1[i]=Math.random()*1.7+.5;
}
const g1=new THREE.BufferGeometry();
g1.setAttribute('position',new THREE.BufferAttribute(p1,3));
g1.setAttribute('aSize',new THREE.BufferAttribute(s1,1));
const sphereMat = new THREE.ShaderMaterial({
  uniforms:{ uTex:{value:sprite}, uA:{value:new THREE.Color('#00f0ff')}, uB:{value:new THREE.Color('#c026ff')}, uPx:{value:Math.min(devicePixelRatio,1.6)} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`attribute float aSize; varying vec3 vP; uniform float uPx;
    void main(){ vP=normalize(position); vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=aSize*uPx*(180./-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform sampler2D uTex; uniform vec3 uA,uB; varying vec3 vP;
    void main(){ float t=smoothstep(-1.,1.,vP.x+vP.y); vec3 c=mix(uB,uA,t); float a=texture2D(uTex,gl_PointCoord).a; gl_FragColor=vec4(c,a*.28); }`
});
const sphere=new THREE.Points(g1,sphereMat); sphere.rotation.set(-.18,0,.1); root.add(sphere);

// ② 漂浮尘埃（远景纵深）
const N2 = mobile ? 700 : 1500;
const p2=new Float32Array(N2*3), s2=new Float32Array(N2);
for(let i=0;i<N2;i++){
  p2[i*3]=(Math.random()-.5)*42; p2[i*3+1]=(Math.random()-.5)*26; p2[i*3+2]=(Math.random()-.5)*30-6;
  s2[i]=Math.random()*1.4+.3;
}
const g2=new THREE.BufferGeometry();
g2.setAttribute('position',new THREE.BufferAttribute(p2,3));
g2.setAttribute('aSize',new THREE.BufferAttribute(s2,1));
const dustMat=new THREE.PointsMaterial({ map:sprite, color:0x00e0ff, size:.05, transparent:true, opacity:.5, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true });
const dust=new THREE.Points(g2,dustMat); scene.add(dust);

// ③ 轨道环
const ring=new THREE.Mesh(new THREE.RingGeometry(4.7,4.73,160), new THREE.MeshBasicMaterial({color:0x00f0ff,transparent:true,opacity:.09,side:THREE.DoubleSide}));
ring.rotation.x=Math.PI*.46; root.add(ring);

// 鼠标视差（接收父页面 postMessage，因 iframe 在背景层无法直接收鼠标）
let px=0,py=0,tx=0,ty=0;
addEventListener('message',(e)=>{ if(e.data&&e.data.t==='pointer'){px=e.data.x;py=e.data.y;} });
addEventListener('mousemove',(e)=>{ px=e.clientX/innerWidth-.5; py=e.clientY/innerHeight-.5; });

function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
resize(); addEventListener('resize',resize);

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  if (document.hidden) return;   // 后台/隐藏时不渲染,省电
  const dt=Math.min(clock.getDelta(),.05);
  if(!reduce){ sphere.rotation.y+=dt*.05; dust.rotation.y+=dt*.012; ring.rotation.z+=dt*.035; }
  tx+=(px*.6-tx)*.045; ty+=(-py*.4-ty)*.045;
  root.rotation.x=ty*.5; root.rotation.y=tx*.6;
  camera.position.x=tx*1.2; camera.position.y=-ty*.8; camera.lookAt(0,0,0);
  renderer.render(scene,camera);
})();
</script>


<canvas id="grid" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none"></canvas>
<script>
// 合成波地平线网格: 底部 1/3 透视网格向观者滚动, 霓虹青线+紫地平线辉光
(function(){
  const c = document.getElementById('grid'), x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DPR = Math.min(devicePixelRatio || 1, 2);
  let W, H, HORIZON;
  function resize(){
    W = innerWidth; H = innerHeight;
    c.width = W * DPR; c.height = H * DPR;
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    HORIZON = H * 0.68;
  }
  resize(); addEventListener('resize', resize);
  let off = 0, last = performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    if (document.hidden) return;
    const dt = Math.min((now-last)/1000, .05); last = now;
    if (!reduce) off = (off + dt * 28) % 44;
    x.clearRect(0, 0, W, H);
    // 地平线辉光
    const g = x.createLinearGradient(0, HORIZON-40, 0, HORIZON+60);
    g.addColorStop(0, 'rgba(192,38,255,0)');
    g.addColorStop(.5, 'rgba(192,38,255,.14)');
    g.addColorStop(1, 'rgba(192,38,255,0)');
    x.fillStyle = g; x.fillRect(0, HORIZON-40, W, 100);
    x.strokeStyle = 'rgba(0,240,255,.16)'; x.lineWidth = 1;
    // 纵向透视线(汇聚于地平线中点)
    const cx = W/2;
    for (let i = -14; i <= 14; i++){
      x.beginPath();
      x.moveTo(cx + i * 26, HORIZON);
      x.lineTo(cx + i * (W/16), H + 40);
      x.stroke();
    }
    // 横向滚动线(近密远疏)
    for (let k = 0; k < 16; k++){
      const t = (k * 44 + off) / (16 * 44);
      const y = HORIZON + Math.pow(t, 2.2) * (H - HORIZON) * 1.15;
      if (y > H + 20) continue;
      x.globalAlpha = .05 + t * .2;
      x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke();
      x.globalAlpha = 1;
    }
  })(last);
})();
</script>

<canvas id="rain" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none"></canvas>
<script>
// 数据雨层：右侧偏置的下落字形列，霓虹青/绿，低透明度不糊字
(function(){
  const c = document.getElementById('rain'), x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GLYPHS = '01アイウエオカキクケコサシスセソ<>/{}[]=+#$%';
  let W,H,cols,drops;
  const DPR = Math.min(devicePixelRatio || 1, 2);
  function resize(){
    W = innerWidth; H = innerHeight;
    c.width = W * DPR; c.height = H * DPR;
    x.setTransform(DPR, 0, 0, DPR, 0, 0);   // Retina 下按 CSS 像素坐标绘制,字形不糊
    const cw = 18; cols = Math.floor(W / cw);
    drops = [];
    for(let i=0;i<cols;i++){
      const xr = i/cols;
      // 右侧密、中左稀(留白给正文)
      if (xr < 0.55 && Math.random() < 0.8) { drops.push(null); continue; }
      drops.push({ y: Math.random()*H, v: 40+Math.random()*90, cw, x:i*cw, hue: Math.random()<0.25?'#00ff9c':'#00f0ff' });
    }
  }
  resize(); addEventListener('resize', resize);
  let last = performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min((now-last)/1000, .05); last = now;
    if (reduce) return;
    x.clearRect(0,0,W,H);
    x.font = '13px monospace';
    for(const d of drops){
      if(!d) continue;
      d.y += d.v*dt; if(d.y > H+80) { d.y = -40; d.v = 40+Math.random()*90; }
      for(let k=0;k<7;k++){
        const a = (1-k/7) * 0.16;
        x.fillStyle = k===0 ? 'rgba(220,255,255,.5)' : d.hue + Math.round(a*255).toString(16).padStart(2,'0');
        x.fillText(GLYPHS[(Math.random()*GLYPHS.length)|0], d.x, d.y - k*16);
      }
    }
  })(last);
})();
</script>
</body>
</html>
