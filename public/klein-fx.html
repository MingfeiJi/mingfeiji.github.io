<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>曜黑玻璃背景</title>
<link rel="preload" as="image" href="/media/obsidian-poster.jpg" />
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  body{background:#000 url('/media/obsidian-poster.jpg') center/cover no-repeat}
  video{width:100vw;height:100vh;object-fit:cover;display:block}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#0005,#0006 50%,#0009)}
</style>
</head>
<body>
<video id="v" muted loop playsinline preload="none" poster="/media/obsidian-poster.jpg" aria-hidden="true"></video>
<script>
(function () {
  var video=document.getElementById('v');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)');
  var inView=true;
  var saveData=Boolean(navigator.connection && navigator.connection.saveData);
  function sync(){
    if(reduce.matches || saveData || document.hidden || !inView){video.pause();return;}
    if(!video.getAttribute('src'))video.src='/media/obsidian-loop.mp4';
    video.play().catch(function(){});
  }
  video.addEventListener('error',function(){video.style.visibility='hidden';});
  addEventListener('message',function(event){
    if(event.origin!==location.origin || event.source!==parent || !event.data || event.data.t!=='fx-visibility')return;
    inView=Boolean(event.data.visible);sync();
  });
  document.addEventListener('visibilitychange',sync);
  reduce.addEventListener('change',sync);
  addEventListener('pagehide',function(){video.pause();});
  addEventListener('pageshow',sync);
  sync();
})();
</script>
</body>
</html>
