<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TripFlow · 38 意图 · 原型 & 动线图谱</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f1ea;
  --bg-2: #ebe5db;
  --paper: #fbf8f2;
  --ink: #1a1a1a;
  --ink-soft: #57534e;
  --ink-mute: #a8a29e;
  --line: #d6d3d1;
  --line-soft: #e7e5e4;
  --accent: #b8511a;
  --accent-soft: #f4dac1;
  --user: #3b5998;
  --user-bg: #dde4ee;
  --agent: #6b3e8b;
  --agent-bg: #e6d8ec;
  --system: #4a5568;
  --system-bg: #d8dde3;
  --d1: #c8602e;
  --d2: #5a8a3a;
  --d3: #2d6da6;
  --d4: #b88523;
  --d5: #5d6772;
  --d6: #7a4a8a;
  --serif: 'Fraunces', 'Noto Serif SC', serif;
  --sans: 'Noto Sans SC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 8% 12%, rgba(184,81,26,0.06) 0%, transparent 40%),
    radial-gradient(circle at 92% 88%, rgba(45,109,166,0.05) 0%, transparent 40%);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ===== Layout ===== */
.app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

.sidebar {
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 24px 0 40px;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--ink-mute); border-radius: 3px; }

.brand { padding: 0 22px 16px; border-bottom: 1px dashed var(--line); margin-bottom: 8px; }
.brand-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-style: italic;
}
.brand-sub {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
  margin-top: 4px;
}
.brand-meta { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin-top: 8px; }

.domain-group { padding: 12px 0; }
.domain-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 22px;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
}
.domain-head .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
.domain-name { font-weight: 600; }
.domain-count { color: var(--ink-mute); font-size: 9px; }

.intent-list { list-style: none; }
.intent-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 22px 7px 30px;
  cursor: pointer;
  font-size: 12.5px;
  transition: background 0.15s;
  border-left: 2px solid transparent;
}
.intent-item:hover { background: var(--paper); }
.intent-item.active {
  background: var(--paper);
  border-left-color: var(--accent);
  font-weight: 500;
}
.intent-id {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-soft);
  min-width: 32px;
  letter-spacing: 0.02em;
}
.intent-item.active .intent-id { color: var(--accent); font-weight: 600; }
.intent-name { flex: 1; }

/* ===== Main ===== */
.main { overflow-y: auto; padding: 28px 40px 60px; }
.main::-webkit-scrollbar { width: 8px; }
.main::-webkit-scrollbar-thumb { background: var(--ink-mute); border-radius: 4px; }

.detail-head {
  border-bottom: 1px dashed var(--line);
  padding-bottom: 18px;
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: end;
}
.eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--ink-mute);
  margin-bottom: 8px;
  display: flex; gap: 12px; align-items: center;
}
.eyebrow .domain-tag {
  padding: 2px 8px;
  border: 1px solid currentColor;
  border-radius: 2px;
}
.detail-title {
  font-family: var(--serif);
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.detail-id {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 6px;
}
.trigger-quote {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--ink-soft);
  margin-top: 8px;
}
.detail-meta {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-soft);
  text-align: right;
  line-height: 1.6;
}
.detail-meta .label { color: var(--ink-mute); }

/* ===== Sections ===== */
.section {
  margin-bottom: 32px;
}
.section-title {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 12px;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: var(--line); display: inline-block;
}

.split { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; }
@media (max-width: 1280px) { .split { grid-template-columns: 1fr; } }

/* ===== Wireframe ===== */
.wireframe {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 18px;
  position: relative;
}
.wireframe::before {
  content: 'PROTOTYPE · WIREFRAME';
  position: absolute; top: -7px; left: 14px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--ink-mute);
  background: var(--bg);
  padding: 0 6px;
}
.wf-window {
  background: white;
  border: 1px solid var(--line);
  border-radius: 3px;
  overflow: hidden;
  font-size: 11.5px;
}
.wf-titlebar {
  background: var(--bg-2);
  padding: 6px 10px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 8px;
}
.wf-titlebar .dots { display: flex; gap: 4px; }
.wf-titlebar .dots span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--line);
}
.wf-body { padding: 14px; min-height: 240px; display: flex; flex-direction: column; gap: 10px; }

/* WF blocks */
.wf-block {
  border: 1px dashed var(--line);
  background: var(--bg);
  padding: 10px 12px;
  border-radius: 3px;
  position: relative;
  font-size: 11.5px;
}
.wf-block.input {
  background: white;
  border: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
}
.wf-block.input::before {
  content: '🔍'; font-size: 11px; opacity: 0.5;
}
.wf-block.main {
  flex: 1;
  background: linear-gradient(180deg, var(--bg) 0%, var(--paper) 100%);
}
.wf-block.side {
  background: var(--bg-2);
  border-style: solid;
  border-color: var(--line-soft);
}
.wf-block .label {
  font-family: var(--mono); font-size: 9px;
  color: var(--ink-mute); text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 4px;
}
.wf-row { display: flex; gap: 10px; }
.wf-row > * { flex: 1; }
.wf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wf-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.wf-list-item {
  padding: 6px 8px;
  border-bottom: 1px dotted var(--line);
  display: flex; justify-content: space-between; gap: 10px;
  font-size: 11px;
}
.wf-list-item:last-child { border-bottom: none; }
.wf-list-item .meta { color: var(--ink-mute); font-family: var(--mono); font-size: 10px; }
.wf-chip {
  display: inline-block; padding: 2px 7px;
  background: white; border: 1px solid var(--line);
  border-radius: 10px; font-size: 10px;
  font-family: var(--mono);
  margin-right: 4px;
}
.wf-chip.active { background: var(--ink); color: white; border-color: var(--ink); }
.wf-chip.warn { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.wf-btn {
  display: inline-block; padding: 5px 12px;
  background: var(--ink); color: white;
  font-family: var(--mono); font-size: 10px;
  border-radius: 2px; cursor: default;
  margin-right: 6px;
}
.wf-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.wf-btn.accent { background: var(--accent); }
.wf-anno {
  position: absolute;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--accent);
  letter-spacing: 0.04em;
}
.wf-bar {
  height: 6px; background: var(--bg-2); border-radius: 3px;
  position: relative; overflow: hidden;
}
.wf-bar::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: var(--p, 60%); background: var(--ink); border-radius: 3px;
}
.wf-stack { display: flex; flex-direction: column; gap: 6px; }

/* ===== Flow ===== */
.flow {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 22px 18px 18px;
  position: relative;
}
.flow::before {
  content: 'USER FLOW · 动线';
  position: absolute; top: -7px; left: 14px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--ink-mute);
  background: var(--bg);
  padding: 0 6px;
}
.flow-steps {
  display: flex; flex-direction: column; gap: 8px;
}
.flow-step {
  display: grid;
  grid-template-columns: 32px 90px 1fr;
  gap: 12px;
  align-items: start;
  padding: 8px 0;
  border-bottom: 1px dotted var(--line-soft);
  position: relative;
}
.flow-step:last-child { border-bottom: none; }
.flow-step .num {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
}
.flow-step .actor {
  font-family: var(--mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 4px 8px;
  border-radius: 2px;
  text-align: center;
  height: fit-content;
}
.actor-user { background: var(--user-bg); color: var(--user); }
.actor-agent { background: var(--agent-bg); color: var(--agent); }
.actor-system { background: var(--system-bg); color: var(--system); }
.flow-step .desc { font-size: 12.5px; line-height: 1.5; }
.flow-step .io {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-mute);
  margin-top: 3px;
}
.flow-step .io::before { content: '→ '; }

/* ===== Notes ===== */
.notes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.note {
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  border-radius: 0 3px 3px 0;
}
.note.success { border-left-color: var(--d2); }
.note.warn { border-left-color: var(--d4); }
.note.info { border-left-color: var(--d3); }
.note .label {
  font-family: var(--mono);
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-mute);
  margin-bottom: 5px;
}
.note .content { font-size: 12px; line-height: 1.55; color: var(--ink-soft); }

/* ===== Overview ===== */
.overview {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 24px 28px;
  margin-bottom: 32px;
}
.overview h2 {
  font-family: var(--serif);
  font-style: italic;
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 6px;
}
.overview p {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 18px;
  max-width: 760px;
}
.overview-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.overview-domain {
  border: 1px solid var(--line);
  background: var(--bg);
  padding: 10px 12px;
  border-radius: 3px;
}
.overview-domain .dot {
  width: 10px; height: 10px; border-radius: 50%;
  display: inline-block; margin-right: 6px;
  vertical-align: middle;
}
.overview-domain .name {
  font-family: var(--mono); font-size: 11px;
  font-weight: 600; letter-spacing: 0.04em;
}
.overview-domain .count {
  font-family: var(--serif); font-size: 28px;
  font-weight: 600; line-height: 1; margin: 6px 0 2px;
}
.overview-domain .label {
  font-family: var(--mono); font-size: 9px;
  color: var(--ink-mute); text-transform: uppercase;
  letter-spacing: 0.1em;
}

@media (max-width: 1100px) {
  .overview-grid { grid-template-columns: repeat(3, 1fr); }
  .notes { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-title">TripFlow</div>
    <div class="brand-sub">Intent Atlas · 38 prototypes</div>
    <div class="brand-meta">v 0.1 · 2026.04 · UX Lab</div>
  </div>
  <nav id="nav"></nav>
</aside>

<main class="main" id="main"></main>

</div>

<script>
// ============ INTENT DATA ============
// 6 业务域 × 38 意图,每个意图包含:原型组件 + 动线步骤 + 关键体验注解

const DOMAINS = {
  D1: { name: '爆款抓取域', desc: '已经火起来 → 仿写/趋势/归因', color: 'var(--d1)' },
  D2: { name: '选题洞察域', desc: '还没火之前 → 主动发现', color: 'var(--d2)' },
  D3: { name: '脚本创作域', desc: '灵感 → 可拍可剪结构化脚本', color: 'var(--d3)' },
  D4: { name: '素材管理域', desc: '召回 / 缺口检测 / 入库', color: 'var(--d4)' },
  D5: { name: '剪辑生产域', desc: '脚本+素材 → 成片', color: 'var(--d5)' },
  D6: { name: '审核发布域', desc: '合规 + 多平台定时', color: 'var(--d6)' },
};

const INTENTS = [
  // ============ D1 · 爆款抓取域 (7) ============
  {
    id: 'I1.1', domain: 'D1', name: '按时间+业务线抓取',
    trigger: '"最近 7 天意铁的爆款"',
    tools: ['platform_api', 'q_score'],
    output: '按 q-score 排序的爆款列表',
    proto: [
      { type: 'titlebar', text: 'D1 / 爆款抓取' },
      { type: 'input', text: '最近 7 天意铁的爆款', anno: '自然语言' },
      { type: 'chips', items: [['7d','active'],['14d',''],['30d',''],['意铁','active']] },
      { type: 'list', items: [
        ['#1 5欧夜卧穿越阿尔卑斯', 'q 8.7'],
        ['#2 凌晨3点的米兰中央', 'q 7.9'],
        ['#3 意大利火车餐车实测', 'q 7.4'],
        ['…共 53 条', 'CRON']
      ]},
      { type: 'sidelog', items: ['[02:00] CRON 启动', '抓取 7d × 意铁', '✓ 53 条入库'] }
    ],
    flow: [
      { actor: 'system', desc: 'CRON 凌晨 02:00 自动触发,或用户主动唤起', io: 'time + biz_line' },
      { actor: 'user', desc: '输入自然语言查询,或点业务线 chip', io: 'query → tool_call' },
      { actor: 'agent', desc: '解析意图、锚定业务线、确定时间窗', io: 'platform_api(7d, 意铁)' },
      { actor: 'system', desc: '拉取原始数据,计算每条 q-score', io: '53 条 + score' },
      { actor: 'user', desc: '浏览结果,或点击进入 I1.2 仿写候选', io: 'list → next intent' }
    ],
    notes: {
      good: '业务线 chip 一键切换,免重输关键词',
      pain: '抓到 500 条不知道哪几条值得看',
      opp: '顶部「今日 3 条最值得看」预筛',
    }
  },
  {
    id: 'I1.2', domain: 'D1', name: '仿写候选 + 脚本质量',
    trigger: '"3 条能仿写的"',
    tools: ['q_score', 'script_quality'],
    output: 'top-3 高潜仿写候选',
    proto: [
      { type: 'titlebar', text: 'D1 / 仿写候选' },
      { type: 'banner', text: '从 53 条爆款 + q-score≥7 筛出 · 3 条', accent: true },
      { type: 'cards', items: [
        ['🎯 #1 5欧夜卧阿尔卑斯', 'q 8.7 · 完播 86%'],
        ['🎯 #2 凌晨3点米兰中央', 'q 7.9 · 完播 79%'],
        ['🎯 #3 火车餐车实测', 'q 7.4 · 互动率 高']
      ]},
      { type: 'actions', items: ['↻ 仿写 → C1.1', '⌕ 找类似', '⊕ 归档'] }
    ],
    flow: [
      { actor: 'agent', desc: '基于 I1.1 的爆款池二次筛选', io: '53 条 → q≥7 + 脚本质量' },
      { actor: 'user', desc: '看到「3 条能仿写的」推荐区', io: 'top-3 候选' },
      { actor: 'user', desc: '点 q-score 想看分数怎么算', io: 'hover → 拆解' },
      { actor: 'agent', desc: '展示 q-score 五维拆解(完播/互动/增速/相关/钩子)', io: '透明度' },
      { actor: 'user', desc: '点「↻ 仿写」→ 流转到 D3 写脚本', io: 'C1.1 组合意图' }
    ],
    notes: {
      good: '3 条比 53 条更可决策',
      pain: 'q-score 怎么算的不透明',
      opp: 'q-score hover 显示五维拆解',
    }
  },
  {
    id: 'I1.3', domain: 'D1', name: '趋势主题聚类 + 词云',
    trigger: '"最近火车类什么在火"',
    tools: ['embedding', 'cluster'],
    output: '主题聚类 + 词云 + 增速',
    proto: [
      { type: 'titlebar', text: 'D1 / 趋势聚类' },
      { type: 'input', text: '最近火车类什么在火' },
      { type: 'cloud', items: ['夜卧 +312%', '阿尔卑斯', '5欧', '亲子 +89%', '餐车', '冬季限定'] },
      { type: 'list', items: [
        ['🔥 夜卧体验类', '17 条 · ↑312%'],
        ['🔥 跨国路线类', '12 条 · ↑156%'],
        ['亲子主题', '9 条 · ↑89%']
      ]},
      { type: 'actions', items: ['+ 加入关注'] }
    ],
    flow: [
      { actor: 'user', desc: '想了解最近哪类内容在升温', io: 'query' },
      { actor: 'agent', desc: '对最近 30d 爆款做 embedding 聚类', io: '聚类算法' },
      { actor: 'system', desc: '生成主题簇 + 增速 + 词云', io: '可视化数据' },
      { actor: 'user', desc: '看到主题列表 + 词云,识别热门主题', io: '决策输入' },
      { actor: 'user', desc: '点「+ 加入关注」转化为持续监测', io: 'watch_list' }
    ],
    notes: {
      good: '帮助用户看到趋势,而非单条爆款',
      pain: '关键词为什么涨没解释',
      opp: '聚类一键转为 D2 选题',
    }
  },
  {
    id: 'I1.4', domain: 'D1', name: '博主爆款扫描',
    trigger: '"@eurail_life 的爆款"',
    tools: ['platform_api', 'follow_list'],
    output: '关注列表内的爆款汇总',
    proto: [
      { type: 'titlebar', text: 'D1 / 博主爆款扫描' },
      { type: 'chips', items: [['@eurail_life','active'],['@trainspotter','active'],['+12 个','']] },
      { type: 'list', items: [

    flow: [
      { actor: 'user', desc: '想知道何时发布最好', io: 'platform' },
      { actor: 'agent', desc: '调历史表现 + 时段模型', io: 'time_predict' },
      { actor: 'agent', desc: '推荐时间 + 6 小时柱状对比', io: 'visualize' },
      { actor: 'user', desc: '采纳或手动改', io: 'pick' }
    ],
    notes: {
      pain: '推荐时间没有理由',
      opp: '推荐时间附近 6 小时柱状对比',
    }
  },
  {
    id: 'I6.5', domain: 'D6', name: '数据回流 + 二次仿写',
    trigger: 'CRON 24h 后',
    tools: ['data_sync', 'derive_gen'],
    output: '24h 数据 + 3 条衍生候选',
    proto: [
      { type: 'titlebar', text: 'D6 / 数据回流 + 衍生' },
      { type: 'banner', text: '🎉 昨天那条爆了 ↑3.1x · 看 3 条延伸', accent: true },
      { type: 'list', items: [
        ['💡 角度变换', '"30 欧能睡王宫上"'],
        ['💡 业务线迁移', '英铁版 · 苏格兰夜卧'],
        ['💡 长度变换', '15s 短版']
      ]},
      { type: 'block', label: '钩子写入', text: 'wiki/hooks · score A→S' }
    ],
    flow: [
      { actor: 'system', desc: 'CRON 24h 后自动拉数据', io: 'data_sync' },
      { actor: 'agent', desc: '检测达基线 → 触发归档', io: 'archive' },
      { actor: 'agent', desc: '主动生成 3 条衍生候选', io: 'derive_gen' },
      { actor: 'system', desc: 'push banner 给用户', io: 'notify' },
      { actor: 'user', desc: '点 banner 选 1 条进入 D3', io: 'next round' }
    ],
    notes: {
      good: '数据-动作绑定 · 30min 内推送行动建议',
      opp: '复用素材包 · skip 部分 D4',
    }
  },
];

// ============ RENDERING ============

const navEl = document.getElementById('nav');
const mainEl = document.getElementById('main');

function buildNav() {
  Object.entries(DOMAINS).forEach(([dKey, d]) => {
    const items = INTENTS.filter(i => i.domain === dKey);
    const group = document.createElement('div');
    group.className = 'domain-group';
    group.innerHTML = `
      <div class="domain-head">
        <span class="domain-name"><span class="dot" style="background:${d.color}"></span>${dKey} · ${d.name}</span>
        <span class="domain-count">${items.length} 意图</span>
      </div>
      <ul class="intent-list">
        ${items.map(i => `
          <li class="intent-item" data-id="${i.id}">
            <span class="intent-id">${i.id}</span>
            <span class="intent-name">${i.name}</span>
          </li>
        `).join('')}
      </ul>
    `;
    navEl.appendChild(group);
  });

  navEl.addEventListener('click', e => {
    const item = e.target.closest('.intent-item');
    if (!item) return;
    document.querySelectorAll('.intent-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
    renderIntent(item.dataset.id);
  });
}

function renderOverview() {
  const counts = Object.keys(DOMAINS).reduce((acc, d) => {
    acc[d] = INTENTS.filter(i => i.domain === d).length; return acc;
  }, {});
  return `
    <div class="overview">
      <h2>意图图谱 · 38 个原型</h2>
      <p>TripFlow 由 6 个业务域(SubAgent)组成,共定义 38 个用户意图。每个意图对应一个原型 + 一条动线。<br>左侧导航选择任一意图查看其线框原型与用户动线。</p>
      <div class="overview-grid">
        ${Object.entries(DOMAINS).map(([k, d]) => `
          <div class="overview-domain">
            <div><span class="dot" style="background:${d.color}"></span><span class="name">${k}</span></div>
            <div class="count">${counts[k]}</div>
            <div class="label">${d.name}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderProtoBlock(c) {
  switch (c.type) {
    case 'titlebar':
      return `<div class="wf-titlebar"><span class="dots"><span></span><span></span><span></span></span>${c.text}</div>`;
    case 'input':
      return `<div class="wf-block input">${c.text}</div>`;
    case 'banner':
      return `<div class="wf-block" style="background:${c.accent?'var(--accent-soft)':''};border-color:${c.accent?'var(--accent)':''};color:${c.accent?'var(--accent)':''}">${c.text}</div>`;
    case 'chips':
      return `<div class="wf-block"><div class="label">CHIPS</div>${c.items.map(([t,s])=>`<span class="wf-chip ${s}">${t}</span>`).join('')}</div>`;
    case 'list':
      return `<div class="wf-block main"><div class="label">LIST</div>${c.items.map(([l,r])=>`<div class="wf-list-item"><span>${l}</span><span class="meta">${r}</span></div>`).join('')}</div>`;
    case 'cards':
      return `<div class="wf-block main"><div class="label">CARDS</div><div class="wf-stack">${c.items.map(([t,m])=>`<div class="wf-list-item" style="background:white;border:1px solid var(--line);border-radius:3px;padding:8px 10px;border-bottom:1px solid var(--line)"><span>${t}</span><span class="meta">${m}</span></div>`).join('')}</div></div>`;
    case 'cloud':
      return `<div class="wf-block"><div class="label">WORD CLOUD</div><div style="display:flex;flex-wrap:wrap;gap:8px">${c.items.map(t=>`<span class="wf-chip" style="font-size:${10+Math.random()*4}px">${t}</span>`).join('')}</div></div>`;
    case 'block':
      return `<div class="wf-block">${c.label?`<div class="label">${c.label}</div>`:''}${c.text||''}${c.bar!==undefined?`<div class="wf-bar" style="--p:${c.bar}%;margin-top:6px"></div>`:''}</div>`;
    case 'grid3':
      return `<div class="wf-grid-3">${c.items.map(([l,r])=>`<div class="wf-block" style="text-align:center"><div class="label">${l}</div><strong>${r}</strong></div>`).join('')}</div>`;
    case 'split':
      return `<div class="wf-row"><div class="wf-block"><div class="label">${c.left[0]}</div>${c.left[1]}</div><div class="wf-block"><div class="label">${c.right[0]}</div>${c.right[1]}</div></div>`;
    case 'sidelog':
      return `<div class="wf-block side"><div class="label">SIDE LOG</div>${c.items.map(t=>`<div style="font-family:var(--mono);font-size:10px;color:var(--ink-soft);padding:2px 0">${t}</div>`).join('')}</div>`;
    case 'actions':
      return `<div class="wf-block" style="border:none;background:transparent;padding:6px 0 0">${c.items.map((t,i)=>`<span class="wf-btn ${i===0?'':'ghost'}">${t}</span>`).join('')}</div>`;
    default: return '';
  }
}

function renderIntent(id) {
  const i = INTENTS.find(x => x.id === id);
  if (!i) return;
  const d = DOMAINS[i.domain];

  const titlebar = i.proto.find(p => p.type === 'titlebar');
  const others = i.proto.filter(p => p.type !== 'titlebar');

  mainEl.innerHTML = `
    <header class="detail-head">
      <div>
        <div class="eyebrow">
          <span class="domain-tag" style="color:${d.color}">${i.domain} · ${d.name}</span>
          <span>${d.desc}</span>
        </div>
        <div class="detail-id">${i.id}</div>
        <h1 class="detail-title">${i.name}</h1>
        <div class="trigger-quote">触发 · ${i.trigger}</div>
      </div>
      <div class="detail-meta">
        <div><span class="label">TOOLS</span> ${(i.tools||[]).map(t=>`<code>${t}</code>`).join(' · ')}</div>
        <div style="margin-top:6px"><span class="label">OUTPUT</span> ${i.output||'-'}</div>
      </div>
    </header>

    <div class="split">
      <section>
        <div class="section-title">原型 · Wireframe</div>
        <div class="wireframe">
          <div class="wf-window">
            ${titlebar ? renderProtoBlock(titlebar) : ''}
            <div class="wf-body">
              ${others.map(renderProtoBlock).join('')}
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-title">动线 · User Flow</div>
        <div class="flow">
          <div class="flow-steps">
            ${i.flow.map((s, idx) => `
              <div class="flow-step">
                <div class="num">${idx+1}</div>
                <div class="actor actor-${s.actor}">${s.actor==='user'?'用户':s.actor==='agent'?'Agent':'系统'}</div>
                <div>
                  <div class="desc">${s.desc}</div>
                  ${s.io?`<div class="io">${s.io}</div>`:''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </section>
    </div>

    ${i.notes ? `
    <section class="section">
      <div class="section-title">体验关键点 · Notes</div>
      <div class="notes">
        ${i.notes.good ? `<div class="note success"><div class="label">✓ Good Practice</div><div class="content">${i.notes.good}</div></div>` : ''}
        ${i.notes.pain ? `<div class="note warn"><div class="label">⚠ Pain Point</div><div class="content">${i.notes.pain}</div></div>` : ''}
        ${i.notes.opp ? `<div class="note info"><div class="label">💡 Opportunity</div><div class="content">${i.notes.opp}</div></div>` : ''}
      </div>
    </section>
    ` : ''}
  `;

  mainEl.scrollTop = 0;
}

function init() {
  buildNav();
  mainEl.innerHTML = renderOverview() + `
    <div style="text-align:center;padding:60px 20px;color:var(--ink-mute);font-family:var(--mono);font-size:11px;letter-spacing:0.1em">
      ← 从左侧选择任一意图查看原型与动线
    </div>
  `;
  // 默认选中第一个
  setTimeout(() => {
    const first = document.querySelector('.intent-item');
    if (first) first.click();
  }, 100);
}

init();
</script>
</body>
</html>
