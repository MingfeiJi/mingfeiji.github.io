document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"zh-CN\"><head>\n<meta charset=\"utf-8\">\n<title>TripFlow 内容工作台 · 交互线框<\u002Ftitle>\n<style id=\"__core\">\n\n/* fonts: system fallback (offline-safe — Manrope/JetBrains degrade gracefully) */\n/* ============ TripFlow 内容工作台 · 线框系统（对齐 TripFlow 视觉）============ */\n:root{\n  /* surfaces — cool lavender-gray */\n  --paper:#F5F6FB;\n  --paper2:#FAFBFE;\n  --panel:#FFFFFF;\n  /* text — cool ink */\n  --ink:#13162A;\n  --ink2:#4A5066;\n  --ink3:#8A8FA3;\n  --ink4:#B5B9C9;\n  /* borders — hairlines */\n  --line:#D5D8E4;        /* medium border / \"linework\" */\n  --line2:#E5E7F0;       /* light divider */\n  --bd:#E5E7F0;\n  --bd2:#D5D8E4;\n  /* accent — TripFlow indigo (AI & primary action) */\n  --accent:#6E5BE8;\n  --accent-h:#5A47D6;\n  --accent-soft:#EFEBFE;\n  --accent-soft2:#F7F5FF;\n  --accent-line:#D9D2FA;\n  /* signature gradient — the “yoyo” AI assistant */\n  --yoyo:linear-gradient(135deg,#FF7A45,#FF5C8A);\n  --yoyo-soft:linear-gradient(135deg,#FFE7D6,#FFE0E8);\n  /* semantic */\n  --ok:#14B881;\n  --warn:#CA8A04;\n  --risk:#E5397A;\n  --note:#3D8AF7;\n  --ph:#E7E9F2;\n  --r:14px;\n  /* fonts (annotations now clean, not handwritten) */\n  --hand:'Manrope','Noto Sans SC',sans-serif;\n  --hand2:'JetBrains Mono','Noto Sans SC',monospace;\n  --ui:'Manrope','Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;\n  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;\n  /* shadows — soft, violet-tinted */\n  --shc:0 1px 2px rgba(20,24,50,.04),0 4px 16px rgba(20,24,50,.05);\n  --shp:0 6px 24px rgba(64,52,180,.12),0 2px 6px rgba(20,24,50,.06);\n  --shd:0 12px 40px rgba(20,24,50,.14);\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}\nbody{min-width:1320px}\n.board{width:1380px;margin:0 auto;padding:26px 30px 90px}\n\n/* ---- primitives (clean) ---- */\n.sk{border:1px solid var(--bd2);border-radius:14px;background:var(--panel);box-shadow:var(--shc)}\n.sk2{border:1px solid var(--bd2);border-radius:14px;background:var(--panel)}\n.dash{border:1.4px dashed var(--line)}\n.hr{height:0;border:0;border-top:1px solid var(--line2);margin:14px 0}\n.hr.solid{border-top:1px solid var(--bd2)}\n\n/* ---- typography ---- */\n.kicker{font-family:var(--ui);font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1.4px;text-transform:uppercase;line-height:1}\n.board-title{font-size:25px;font-weight:800;letter-spacing:-.4px;margin:7px 0 4px}\n.board-sub{font-size:13.5px;color:var(--ink2);line-height:1.55;max-width:880px}\n.sec{font-family:var(--ui);font-size:17px;font-weight:800;letter-spacing:-.2px;color:var(--ink);display:flex;align-items:center;gap:8px}\n.h{font-size:14px;font-weight:700;letter-spacing:-.1px}\n.t{font-size:13px;color:var(--ink)}\n.t2{font-size:12px;color:var(--ink2)}\n.t3{font-size:11px;color:var(--ink3)}\n.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:-.2px}\n.bold{font-weight:700}\n\n/* skeleton text bars */\n.bar{height:9px;border-radius:6px;background:#E3E6F0;display:block}\n.bar.d{background:#D5D8E4}\n.bar.w70{width:70%}.bar.w55{width:55%}.bar.w40{width:40%}.bar.w85{width:85%}.bar.w30{width:30%}\n\n/* media placeholder */\n.ph{background:\n   repeating-linear-gradient(45deg,#E7E9F2 0 9px,#EEF0F7 9px 18px);\n   border:1px solid var(--line2);border-radius:10px;\n   position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}\n.ph .lbl{font-family:var(--mono);font-size:10px;color:#9499ad;background:rgba(255,255,255,.85);\n   padding:2px 7px;border-radius:5px;letter-spacing:0}\n.play{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(19,22,42,.55);\n   display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}\n.play::after{content:'';border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}\n.dur{position:absolut :var(--ok)}.dot.warn{background:#F5A623}.dot.risk{background:var(--risk)}.dot.gray{background:var(--ink3)}\n\n/* annotation callouts — clean designer notes */\n.note{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--accent);line-height:1.3;position:relative}\n.note.or{color:var(--accent)}\n.note .arw{font-family:var(--mono)}\n.anno{display:flex;gap:8px;align-items:flex-start;font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--accent);line-height:1.4;background:var(--accent-soft2);border:1px solid var(--accent-line);border-radius:10px;padding:8px 12px}\n.anno::before{content:'✎';font-size:12px;opacity:.85;margin-top:1px;flex:none}\n.anno.or{color:var(--accent)}\n.tape{display:inline-block;background:var(--accent-soft);border:1px solid var(--accent-line);font-family:var(--ui);font-size:11px;font-weight:700;color:var(--accent);padding:3px 11px;border-radius:999px}\n\n/* layout helpers */\n.row{display:flex;gap:14px}\n.col{display:flex;flex-direction:column;gap:14px}\n.between{display:flex;align-items:center;justify-content:space-between}\n.center{display:flex;align-items:center;gap:8px}\n.wrap{flex-wrap:wrap}\n.grow{flex:1}\n.pad{padding:14px}\n.pad16{padding:16px}\n\n/* ====== APP CHROME ====== */\n.app{border:1px solid var(--bd);border-radius:18px;background:var(--panel);overflow:hidden;display:flex;box-shadow:var(--shp)}\n.nav{width:142px;flex:none;border-right:1px solid var(--bd);background:var(--panel);display:flex;flex-direction:column;padding:14px 10px;gap:2px}\n.brand{display:flex;align-items:center;gap:9px;padding:4px 6px 14px}\n.brand .mk{width:28px;height:28px;border-radius:9px;background:var(--yoyo);position:relative;flex:none;box-shadow:0 4px 10px rgba(255,92,138,.32)}\n.brand .mk::after{content:'';position:absolute;left:10px;top:8px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}\n.brand b{font-size:14px;letter-spacing:-.2px}\n.nav a{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);padding:8px 9px;border-radius:9px;text-decoration:none;font-weight:600}\n.nav a .ni{width:15px;height:15px;border:1.5px solid currentColor;border-radius:5px;flex:none}\n.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}\n.nav a.on .ni{border-color:var(--accent)}\n.nav .collect{margin-top:9px;background:var(--accent);color:#fff;border-radius:999px;justify-content:center;font-weight:700;box-shadow:0 4px 10px rgba(110,91,232,.25)}\n.nav .collect .ni{border:0}\n.nav .sp{flex:1}\n.nav .me{display:flex;align-items:center;gap:8px;padding:8px 6px;border-top:1px solid var(--line2);margin-top:6px}\n.nav .me .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);flex:none}\n\n.main{flex:1;min-width:0;display:flex;flex-direction:column}\n.top{height:60px;flex:none;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel)}\n.search{flex:1;max-width:560px;height:38px;border:1px solid var(--bd2);border-radius:999px;display:flex;align-items:center;gap:9px;padding:0 14px;background:var(--paper2)}\n.search .mag{width:14px;height:14px;border:1.6px solid var(--ink3);border-radius:50%;position:relative;flex:none}\n.search .mag::after{content:'';position:absolute;width:6px;height:1.6px;background:var(--ink3);transform:rotate(45deg);right:-4px;bottom:0}\n.search .ph-t{font-size:12.5px;color:var(--ink3)}\n.search .nl{margin-left:auto;font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 8px;background:var(--accent-soft)}\n.proj{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border:1px solid var(--bd2);border-radius:999px;padding:7px 13px;background:var(--panel)}\n.proj .cv{width:6px;height:6px;border-bottom:1.6px solid var(--ink3);border-right:1.6px solid var(--ink3);transform:rotate(45deg);margin-top:-3px}\n.topright{margin-left:auto;display:flex;align-items:center;gap:10px}\n.content{padding:18px;overflow:auto}\n\n/* util grids */\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}\n.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}\n.card{border:1px solid var(--bd);border-radius:14px;background:var(--panel);padding:14px;box-shadow:var(--shc)}\n.card.sk{border-color:var(--bd2)}\n.label-pin{font-family:var(--ui);font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:3px 10px;display:inline-block}\n\n<\u002Fstyle>\n<style>\n  html,body{height:100%;min-width:0;overflow:hidden}\n  .shell{display:flex;height:100vh}\n  .idx{width:248px;flex:none;background:#fff;border-right:1px solid var(--bd2);display:flex;flex-direction:column;overflow:auto}\n  .idx .hd{padding:20px 20px 14px;border-bottom:1px solid var(--line2)}\n  .idx .hd .mk{width:34px;height:34px;border-radius:11px;background:var(--yoyo);position:relative;margin-bottom:10px;box-shadow:0 6px 16px rgba(255,92,138,.32)}\n  .idx .hd .mk::after{content:'';position:absolute;left:12px;top:9px;border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}\n  .idx .hd h1{font-size:16px;letter-spacing:-.3px}\n  .idx .hd .k{font-family:var(--ui);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);font-weight:800;line-height:1}\n  .idx .hd p{font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.45}\n  .grp{padding:15px 13px 5px;font-family:var(--ui);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3);font-weight:800}\n  .idx a{display:flex;align-items:center;gap:11px;padding:9px 13px;margin:1px 8px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:13px;cursor:pointer}\n  .idx a .n{width:22px;height:22px;flex:none;border:1px solid var(--bd2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700}\n  .idx a:hover{background:var(--paper)}\n  .idx a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}\n  .idx a.on .n{border-color:var(--accent);color:var(--accent)}\n  .idx .ft{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--ink3);line-height:1.5}\n  .stage{flex:1;min-width:0;background:var(--paper);position:relative}\n  .stage iframe{width:100%;height:100%;border:0;display:block;background:var(--paper)}\n  .hint{position:absolute;right:16px;bottom:14px;font-family:var(--ui);font-weight:600;font-size:12px;color:var(--ink3);background:#fff;border:1px solid var(--line2);border-radius:999px;padding:6px 13px;pointer-events:none;box-shadow:var(--shc)}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"shell\">\n  <nav class=\"idx\">\n    <div class=\"hd\">\n      <div class=\"mk\"><\u002Fdiv>\n      <div class=\"k\">Wireframes<\u002Fdiv>\n      <h1>TripFlow 内容工作台<\u002Fh1>\n      <p>AI 内容增长流水线 · 交互线框<br>爆款发现 → 沉淀 → 生成 → 召回 → 剪辑 → 审核 → 回流<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grp\">结构<\u002Fdiv>\n    <a data-page=\"00\" class=\"on\"><span class=\"n\">IA<\u002Fspan>信息架构地图<\u002Fa>\n    <div class=\"grp\">关键页面线框<\u002Fdiv>\n    <a data-page=\"01\"><span class=\"n\">01<\u002Fspan>首页 · 指挥台<\u002Fa>\n    <a data-page=\"02\"><span class=\"n\">02<\u002Fspan>资产库 + AI 动作栏<\u002Fa>\n    <a data-page=\"03\"><span class=\"n\">03<\u002Fspan>素材详情 · 血缘树<\u002Fa>\n    <a data-page=\"04\"><span class=\"n\">04<\u002Fspan>灵感分析<\u002Fa>\n    <a data-page=\"05\"><span class=\"n\">05<\u002Fspan>脚本/SRT 剪辑流程<\u002Fa>\n    <a data-page=\"06\"><span class=\"n\">06<\u002Fspan>审核<\u002Fa>\n    <a data-page=\"07\"><span class=\"n\">07<\u002Fspan>数据反馈<\u002Fa>\n    <div class=\"grp\">交付<\u002Fdiv>\n    <a data-page=\"08\"><span class=\"n\">★<\u002Fspan>高保真视觉风格建议<\u002Fa>\n    <div class=\"ft\">线框 · 用于对齐结构与流程<br>非最终视觉。靛紫 = AI / 关键交互；渐变 = yoyo 助手。<\u002Fdiv>\n  <\u002Fnav>\n  <div class=\"stage\">\n    <iframe id=\"stage\"><\u002Fiframe>\n    <div class=\"hint\">← 左侧切换页面<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<script type=\"text/html\" data-page=\"00\"><style>\n  .pipe{display:flex;align-items:stretch;gap:0;margin:18px 0 6px}\n  .pstep{flex:1;border:1px solid var(--bd2);border-radius:11px;padding:11px 12px;background:#fff;position:relative}\n  .pstep .pn{font-family:var(--hand2);font-size:12px;color:var(--accent);font-weight:700}\n  .pstep .pt{font-size:13px;font-weight:700;margin-top:2px}\n  .pstep .pd{font-size:10.5px;color:var(--ink2);margin-top:3px;line-height:1.35}\n  .parr{align-self:center;font-family:var(--hand2);font-size:22px;color:var(--accent);padding:0 6px;flex:none}\n  .modgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}\n  .mod{border:1px solid var(--bd2);border-radius:13px;background:#fff;overflow:hidden}\n  .mod .mh{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line2);background:var(--paper2)}\n  .mod .mh .mi{width:26px;height:26px;border:1px solid var(--bd2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;flex:none}\n  .mod .mh b{font-size:14px}\n  .mod .mh .mz{font-family:var(--hand);font-size:13px;color:var(--ink3);margin-left:auto}\n  .mod ul{list-style:none;padding:9px 13px 12px}\n  .mod li{font-size:11.5px;color:var(--ink2);padding:3px 0 3px 14px;position:relative;line-height:1.3}\n  .mod li::before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;border:1px solid var(--ink3);border-radius:2px}\n  .mod li b{color:var(--ink);font-weight:600}\n  .mod.hot{border-color:var(--accent)}\n  .mod.hot .mh{background:var(--accent-soft)}\n  .mod.hot .mh .mi{border-color:var(--accent);color:var(--accent)}\n  .cross{border:1.4px dashed var(--accent-line);border-radius:13px;background:var(--accent-soft);padding:14px 16px;margin-top:16px}\n  .cross .cg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:10px}\n  .cross .ci{background:#fff;border:1px solid var(--accent-line);border-radius:10px;padding:9px 11px}\n  .cross .ci b{font-size:12px;display:block;color:var(--accent)}\n  .cross .ci p{font-size:10.5px;color:var(--ink2);line-height:1.35;margin-top:3px}\n  .loop{display:inline-flex;align-items:center;gap:6px;font-family:var(--hand);font-size:16px;color:var(--accent)}\n<\u002Fstyle>\n<body>\n<div class=\"board\">\n  <div class=\"kicker\">Information Architecture<\u002Fdiv>\n  <div class=\"board-title\">产品信息架构 · 一条可复用的内容生产流水线<\u002Fdiv>\n  <p class=\"board-sub\">8 个一级模块挂在同一条流水线上。项目（Project）是组织一切的容器；搜索、+采集、资产库↔创作双向打通、血缘关系、任务队列是贯穿全局的能力。<\u002Fp>\n\n  <!-- pipeline -->\n  <div class=\"sec\" style=\"margin-top:18px\">内容生产主线<\u002Fdiv>\n  <div class=\"pipe\">\n    <div class=\"pstep\"><div class=\"pn\">01<\u002Fdiv><div class=\"pt\">爆款发现<\u002Fdiv><div class=\"pd\">灵感 · 关键词/榜单/博主<\u002Fdiv><\u002Fdiv>\n    <div class=\"parr\">→<\u002Fdiv>\n    <div class=\"pstep\"><div class=\"pn\">02<\u002Fdiv><div class=\"pt\">素材沉淀<\u002Fdiv><div class=\"pd\">资产库 · 采集/去重/打标<\u002Fdiv><\u002Fdiv>\n    <div class=\"parr\">→<\u002Fdiv>\n    <div class=\"pstep\"><div class=\"pn\">03<\u002Fdiv><div class=\"pt\">脚本生成<\u002Fdiv><div class=\"pd\">创作 · AI 写脚本/文生图<\u002Fdiv><\u002Fdiv>\n    <div class=\"parr\">→<\u002Fdiv>\n    <div class=\"pstep\"><div class=\"pn\">04<\u002Fdiv><div class=\"pt\">素材召回<\u002Fdiv><div class=\"pd\">语义匹配 · SRT 拆段<\u002Fdiv><\u002Fdiv>\n    <div class=\"parr\">→<\u002Fdiv>\n    <div class=\"pstep\"><div class=\"pn\">05<\u002Fdiv><div class=\"pt\">智能剪辑<\u002Fdiv><div class=\"pd\">拼接/混剪/模板/导出<\u002Fdiv><\u002Fdiv>\n    <div class=\"parr\">→<\u002Fdiv>\n    <div class=\"pstep\"><div class=\"pn\">06<\u002Fdiv><div class=\"pt\">审核<\u002Fdiv><div class=\"pd\">合规/事实/品牌规则<\u002Fdiv><\u002Fdiv>\n    <div class=\"parr\">→<\u002Fdiv>\n    <div class=\"pstep\" style=\"border-color:var(--accent)\"><div class=\"pn\">07<\u002Fdiv><div class=\"pt\">表现回流<\u002Fdiv><div class=\"pd\">数据 · 爆款配方沉淀<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"center\" style=\"margin:8px 0 4px;justify-content:flex-end\">\n    <span class=\"loop\">↺ 成片 / 表现数据自动回流资产库 与 灵感池<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- modules -->\n  <div class=\"sec\" style=\"margin-top:20px\">一级导航模块<\u002Fdiv>\n  <div class=\"modgrid\">\n    <div class=\"mod hot\">\n      <div class=\"mh\"><span class=\"mi\">⌂<\u002Fspan><b>首页<\u002Fb><span class=\"mz\">指挥台<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li><b>今日任务<\u002Fb>：待审核/待剪辑/待补标签/失败工作流<\u002Fli>\n        <li><b>爆款提醒<\u002Fb>：关键词热度↑、竞品更新、榜单新增<\u002Fli>\n        <li><b>高潜素材推荐<\u002Fb>：未用相似爆款/历史好/可裂变<\u002Fli>\n        <li><b>最近项目<\u002Fb>：进度·素材数·产出数·审核状态<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"mod hot\">\n      <div class=\"mh\"><span class=\"mi\">✦<\u002Fspan><b>灵感<\u002Fb><span class=\"mz\">选题输入<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>关键词全网搜索 · 爆款抓取 · 榜单抓取<\u002Fli>\n        <li>博主跟踪 · 单链分析 · 账号视频分析<\u002Fli>\n        <li><b>AI 拆解<\u002Fb>：爆款原因/开头结构/话术/可复刻点/风险<\u002Fli>\n        <li>收藏到项目灵感池 · 「看过不看」次日隐藏<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"mod hot\">\n      <div class=\"mh\"><span class=\"mi\">▦<\u002Fspan><b>资产库<\u002Fb><span class=\"mz\">产品中台<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>视觉优先瀑布流 / 文本类列表视图切换<\u002Fli>\n        <li>视频/图文/脚本/BGM/AI生成/Maix切片/爆款开头<\u002Fli>\n        <li><b>选中即用<\u002Fb> 上下文 AI 动作栏（不跳页）<\u002Fli>\n        <li>使用次数·爆款角标·去重风险·权限范围<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"mod hot\">\n      <div class=\"mh\"><span class=\"mi\">✎<\u002Fspan><b>创作<\u002Fb><span class=\"mz\">AI 生成<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>AI 写脚本 · 图文批量 · 文生图/图生图<\u002Fli>\n        <li>文生视频/图生视频 · 一生多 · 相似生成<\u002Fli>\n        <li>tripyoyo skill · 提示词模板与版本管理<\u002Fli>\n        <li>结果自动回流资产库<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"mod hot\">\n      <div class=\"mh\"><span class=\"mi\">✂<\u002Fspan><b>剪辑<\u002Fb><span class=\"mz\">脚本→成片<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>脚本转视频 · SRT 转视频 · 音视频转 SRT<\u002Fli>\n        <li>SRT 召回素材拼接 · 智能切片 · 自动分镜<\u002Fli>\n        <li>拼接混剪 · 模板套用 · 批量导出<\u002Fli>\n        <li>时间轴微调替换 · 去重 · 合规<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"mod\">\n      <div class=\"mh\"><span class=\"mi\">✓<\u002Fspan><b>审核<\u002Fb><span class=\"mz\">能发·不出错<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>脚本/图文/视频审核 · 事实核查<\u002Fli>\n        <li>合规规则 · 品牌规则 · 风险提示<\u002Fli>\n        <li><b>可解释<\u002Fb>：标注具体问题/风险等级/修改建议<\u002Fli>\n        <li>导出前·批量完成后·高风险时介入<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"mod\">\n      <div class=\"mh\"><span class=\"mi\">▤<\u002Fspan><b>数据<\u002Fb><span class=\"mz\">评测迭代<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>成片表现 · 素材表现 · 爆款归因<\u002Fli>\n        <li>有效开头/脚本模板/提示词排行<\u002Fli>\n        <li>工作流成功率 · 失败原因分析<\u002Fli>\n        <li>高潜素材推荐 · 可复刻组合推荐<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"mod\">\n      <div class=\"mh\"><span class=\"mi\">⚙<\u002Fspan><b>设置<\u002Fb><span class=\"mz\">治理<\u002Fspan><\u002Fdiv>\n      <ul>\n        <li>团队/项目权限 · 标签体系<\u002Fli>\n        <li>去重阈值 · 裂变差异度阈值<\u002Fli>\n        <li>合规规则 · 工作流配置<\u002Fli>\n        <li>提示词版本 · Code 码/营销配置<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- cross-cutting -->\n  <div class=\"cross\">\n    <div class=\"center\"><span class=\"label-pin\" style=\"background:var(--accent)\">贯穿全局<\u002Fspan><b style=\"font-size:14px;color:var(--accent)\">不属于单一模块、但支撑所有模块的能力<\u002Fb><\u002Fdiv>\n    <div class=\"cg\">\n      <div class=\"ci\"><b>🔍 搜索一等公民<\u002Fb><p>关键词 / 语义 / 自然语言描述片段，全局可达<\u002Fp><\u002Fdiv>\n      <div class=\"ci\"><b>＋ 采集入口<\u002Fb><p>链接 · 检索 · 上传 · AI生成 · 账号抓取<\u002Fp><\u002Fdiv>\n      <div class=\"ci\"><b>⛓ 血缘关系<\u002Fb><p>原始→切片→裂变→成片→爆款结果可追溯<\u002Fp><\u002Fdiv>\n      <div class=\"ci\"><b>☰ 任务队列<\u002Fb><p>批量任务状
