<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ink dynamic</title>
<style>
  /* 透明背景：父页面「水墨」主题自带宣纸白底，本层只叠墨 */
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============================================================================
   「动态水墨」背景特效 —— 纯 Canvas2D
   大写意美学：①洇墨团缓慢晕开再淡去 ②大笔触自己"写"出来(带飞白)后慢慢干透
   ③笔触起笔处少量墨点飞溅 ④右下远山淡墨(静态)
   浅底深墨、正常混合、不发光；构图偏右下，中左留白给正文。
   —— 主控微调区：所有可调参数集中在 CONFIG，均带注释 ——
   ============================================================================ */

const CONFIG = {
  ink:        '#1a1a1a',   // 主墨色
  cinnabar:   '#9E2B25',   // 朱磦（极少量，笔触偶发用一次暖色）

  // —— 洇墨团（生长→保持→淡去的呼吸循环）——
  bloomMax:       5,       // 同时存在的最大洇墨团数
  bloomEvery:     [3.5,7], // 新团生成间隔区间(秒)
  bloomGrow:      [6,10],  // 单团从 0 长到满的时长(秒)
  bloomHold:      [4,8],   // 满幅保持时长(秒)
  bloomFade:      [6,10],  // 淡出时长(秒)
  bloomR:         [120,300],// 满幅半径(px, 按屏幕短边 900 比例缩放)
  bloomAlpha:     0.10,    // 单团核心不透明度(0.06~0.14, 太高糊字)
  bloomEdgeBias:  0.55,    // 位置向边缘偏置(0~1)

  // —— 大写意笔触（自书 + 飞白 + 干透淡去）——
  strokeEvery:    [9,15],  // 新笔触间隔区间(秒)
  strokeMax:      2,       // 同时存在的最大笔触数
  strokeDraw:     [2.2,3.2],// 书写时长(秒)
  strokeLife:     [9,14],  // 写完后保持+淡出总时长(秒)
  strokeAlpha:    0.22,    // 笔触主干不透明度(0.14~0.30)
  strokeWidth:    [14,28], // 主干最大宽度区间(px)
  strokeLen:      [0.35,0.6],// 笔触长度占屏幕宽比例
  flyWhite:       0.30,    // 飞白比例(0~0.5, 越大断墨越多)
  cinnabarOdds:   0.12,    // 某笔用朱磦的概率(点睛,别高)

  // —— 墨点飞溅（随笔触起笔出现）——
  splatterN:      [3,7],   // 每笔溅点数量区间

  // —— 远山淡墨（静态两叠,右下）——
  showMountain:   true,
  mountainAlpha:  0.035,   // 山影不透明度(0.02~0.05)

  // —— 光标视差 ——
  parallax:       14,      // 位移幅度(px)
  parallaxEase:   0.05,
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const PX = Math.min(window.devicePixelRatio || 1, 1.6);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, MIN = 0;
const mobile = () => innerWidth < 760;

/* ---------- 工具 ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => rand(arr[0], arr[1]);
function rgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
// 边缘偏置：值更靠近区间两端（中间留白）
function edgeBiased(size, bias){
  let v = Math.random();
  v = v < 0.5 ? Math.pow(v * 2, 1 + bias * 2) / 2
              : 1 - Math.pow((1 - v) * 2, 1 + bias * 2) / 2;
  return v * size;
}
// 避开左侧正文区：x 若落在左 55% 区域则推向右/边缘
function textSafeX(x){
  if (x > W * 0.18 && x < W * 0.55) return W * rand(0.58, 0.95);
  return x;
}
// 夹进画面安全框（防止元素生成在屏外只剩一小截）
const clampX = (x) => Math.max(W * 0.05, Math.min(W * 0.95, x));
const clampY = (y) => Math.max(H * 0.08, Math.min(H * 0.92, y));

/* ---------- 洇墨团 ---------- */
let blooms = [], bloomTimer = 0;
function spawnBloom(){
  const scaleR = Math.max(0.55, MIN / 900);
  const lobes = [];
  const n = 6 + (Math.random() * 4 | 0);          // 6~9 个花瓣叠出不规则边缘
  for(let i = 0; i < n; i++){
    lobes.push({ a: rand(0, Math.PI*2), d: rand(0.15, 0.55), s: rand(0.5, 0.95) });
  }
  blooms.push({
    x: clampX(textSafeX(edgeBiased(W, CONFIG.bloomEdgeBias))),
    y: clampY(edgeBiased(H, CONFIG.bloomEdgeBias)),
    R: pick(CONFIG.bloomR) * scaleR,
    grow: pick(CONFIG.bloomGrow), hold: pick(CONFIG.bloomHold), fade: pick(CONFIG.bloomFade),
    t: 0, lobes,
    op: CONFIG.bloomAlpha * rand(0.7, 1.1),
    depth: rand(0.4, 1),
  });
}
function stepBloom(b, dt){
  b.t += dt;
  return b.t < b.grow + b.hold + b.fade;
}
function bloomState(b){
  // 生长(0→1) → 保持(1) → 淡出(1→0)；生长期 alpha 同步升
  if (b.t < b.grow){ const p = b.t / b.grow; return { r: 1 - Math.pow(1-p, 2.2), a: Math.min(1, p*1.6) }; }
  if (b.t < b.grow + b.hold) return { r: 1, a: 1 };
  const p = (b.t - b.grow - b.hold) / b.fade;
  return { r: 1 + p * 0.08, a: 1 - p };          // 淡出时轻微继续洇开
}
function drawBloom(b){
  const st = bloomState(b);
  const ox = tx * CONFIG.parallax * b.depth, oy = ty * CONFIG.parallax * b.depth;
  for(const l of b.lobes){
    const r = b.R * st.r * l.s;
    const cx = b.x + ox + Math.cos(l.a) * b.R * st.r * l.d;
    const cy = b.y + oy + Math.sin(l.a) * b.R * st.r * l.d;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    const a = b.op * st.a / b.lobes.length * 3;   // 花瓣重叠处自然更浓
    g.addColorStop(0,   rgba(CONFIG.ink, a));
    g.addColorStop(0.55, rgba(CONFIG.ink, a * 0.5));
    g.addColorStop(1,   rgba(CONFIG.ink, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- 大写意笔触 ---------- */
let strokes = [], strokeTimer = 0;
function spawnStroke(){
  const len = W * pick(CONFIG.strokeLen) * (mobile() ? 0.8 : 1);
  // 起笔与收笔都锁在画面安全框内：先定起点(偏右/偏边)，再选一个能容下整笔的方向
  let x0 = clampX(textSafeX(edgeBiased(W, 0.5)));
  let y0 = clampY(edgeBiased(H, 0.45));
  let ang = rand(-0.45, 0.45) + (Math.random() < 0.5 ? 0 : Math.PI);
  let x3 = x0 + Math.cos(ang) * len, y3 = y0 + Math.sin(ang) * len * rand(0.35, 0.8);
  if (x3 < W * 0.05 || x3 > W * 0.95){ ang = Math.PI - ang; x3 = x0 + Math.cos(ang) * len; }
  x3 = clampX(x3); y3 = clampY(y3);
  const x1 = x0 + (x3-x0)*0.33 + rand(-len*0.12, len*0.12);
  const y1 = y0 + (y3-y0)*0.33 + rand(-len*0.18, len*0.18);
  const x2 = x0 + (x3-x0)*0.66 + rand(-len*0.12, len*0.12);
  const y2 = y0 + (y3-y0)*0.66 + rand(-len*0.18, len*0.18);
  // 采样 64 点 + 每点法向
  const N = 64, pts = [];
  for(let i = 0; i <= N; i++){
    const t = i / N, mt = 1 - t;
    const x = mt*mt*mt*x0 + 3*mt*mt*t*x1 + 3*mt*t*t*x2 + t*t*t*x3;
    const y = mt*mt*mt*y0 + 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t*y3;
    pts.push({x, y});
  }
  const wSeed = rand(0, Math.PI * 2);
  for(let i = 0; i <= N; i++){
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(N,i+1)];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    pts[i].nx = -dy / d; pts[i].ny = dx / d;
    // 宽度轮廓：起笔重、中段提、收笔尖 + 平滑提按起伏（sin 噪声，避免逐点抖动的锯齿边）
    const t = i / N;
    const press = 0.85 + 0.28 * Math.sin(i * 0.55 + wSeed) * Math.sin(i * 0.23 + wSeed * 2);
    pts[i].w = (Math.sin(Math.min(t*3,1) * Math.PI/2) * (1 - t*0.85) + 0.06) * press;
    pts[i].gap = Math.random() < CONFIG.flyWhite * t;   // 越到笔尾飞白越多
  }
  // 主锋一条实带 + 2~3 条边缘干笔细丝
  const subs = [{ off: 0, wMul: 1, aMul: 0.9 }];
  const sn = 2 + (Math.random() * 2 | 0);
  for(let i = 0; i < sn; i++){
    subs.push({ off: rand(0.55, 1.1) * (Math.random() < 0.5 ? -1 : 1), wMul: rand(0.12, 0.3), aMul: rand(0.45, 0.85) });
  }
  const cinnabar = Math.random() < CONFIG.cinnabarOdds;
  strokes.push({
    pts, subs, cinnabar,
    wMax: pick(CONFIG.strokeWidth) * (mobile() ? 0.7 : 1),
    draw: pick(CONFIG.strokeDraw), life: pick(CONFIG.strokeLife),
    t: 0, op: CONFIG.strokeAlpha * rand(0.8, 1.1),
    depth: rand(0.5, 1),
    splat: null,
  });
  // 起笔溅点
  const s = strokes[strokes.length-1];
  const sn2 = Math.round(pick(CONFIG.splatterN));
  s.splat = [];
  for(let i = 0; i < sn2; i++){
    s.splat.push({ x: x0 + rand(-38, 38), y: y0 + rand(-30, 30), r: rand(0.8, 2.6), a: rand(0.3, 0.9) });
  }
}
function stepStroke(s, dt){ s.t += dt; return s.t < s.draw + s.life; }
// 变宽色带填充：沿法线撑开成多边形一次 fill，杜绝描线接头伪影
function fillRibbon(s, run, sub, ox, oy){
  if (run.length < 2) return;
  ctx.beginPath();
  for(let i = 0; i < run.length; i++){
    const p = run[i];
    const hw = Math.max(0.3, s.wMax * p.w * sub.wMul) / 2;
    const cx = p.x + p.nx * sub.off * s.wMax * 0.5 + ox;
    const cy = p.y + p.ny * sub.off * s.wMax * 0.5 + oy;
    const x = cx + p.nx * hw, y = cy + p.ny * hw;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  for(let i = run.length - 1; i >= 0; i--){
    const p = run[i];
    const hw = Math.max(0.3, s.wMax * p.w * sub.wMul) / 2;
    const cx = p.x + p.nx * sub.off * s.wMax * 0.5 + ox;
    const cy = p.y + p.ny * sub.off * s.wMax * 0.5 + oy;
    ctx.lineTo(cx - p.nx * hw, cy - p.ny * hw);
  }
  ctx.closePath(); ctx.fill();
}
function drawStroke(s){
  const prog = Math.min(1, s.t / s.draw);                 // 书写进度
  const k = Math.floor(prog * (s.pts.length - 1));
  let fade = 1;
  if (s.t > s.draw){
    const p = (s.t - s.draw) / s.life;
    fade = 1 - Math.pow(p, 1.6);                          // 干透淡去
  }
  const color = s.cinnabar ? CONFIG.cinnabar : CONFIG.ink;
  const ox = tx * CONFIG.parallax * s.depth, oy = ty * CONFIG.parallax * s.depth;
  ctx.save();
  const N = s.pts.length - 1;
  for(const sub of s.subs){
    ctx.fillStyle = rgba(color, s.op * sub.aMul * fade);
    let run = [];
    for(let i = 0; i <= k; i++){
      const p = s.pts[i];
      // 飞白断墨：细丝全程可断；主锋只在笔尾 20% 允许断
      if (p.gap && (sub.wMul < 0.7 || i / N > 0.8)){ fillRibbon(s, run, sub, ox, oy); run = []; continue; }
      run.push(p);
    }
    fillRibbon(s, run, sub, ox, oy);
  }
  // 起笔溅点（随笔触一起淡去）
  if (prog > 0.05) for(const d of s.splat){
    ctx.fillStyle = rgba(color, s.op * d.a * fade);
    ctx.beginPath(); ctx.arc(d.x + ox, d.y + oy, d.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 远山淡墨（静态,resize 时重建）---------- */
let mountains = [];
function buildMountains(){
  mountains = [];
  if(!CONFIG.showMountain) return;
  for(let m = 0; m < 2; m++){
    const baseY = H * (0.86 + m * 0.07);
    const pts = [];
    const n = 7;
    for(let i = 0; i <= n; i++){
      pts.push({ x: W * (0.42 + 0.6 * i / n), y: baseY - Math.abs(Math.sin(i*2.2 + m*3)) * H * (0.10 - m*0.03) * rand(0.6, 1) });
    }
    mountains.push({ pts, a: CONFIG.mountainAlpha * (1 - m*0.35), baseY });
  }
}
function drawMountains(){
  for(const m of mountains){
    ctx.fillStyle = rgba(CONFIG.ink, m.a);
    ctx.beginPath();
    ctx.moveTo(m.pts[0].x, H + 2);
    for(const p of m.pts) ctx.lineTo(p.x, p.y);
    ctx.lineTo(m.pts[m.pts.length-1].x, H + 2);
    ctx.closePath(); ctx.fill();
  }
}

/* ---------- 尺寸 ---------- */
function resize(){
  W = innerWidth; H = innerHeight; MIN = Math.min(W, H);
  canvas.width = Math.round(W * PX);
  canvas.height = Math.round(H * PX);
  ctx.setTransform(PX, 0, 0, PX, 0, 0);
  buildMountains();
}

/* ---------- 光标视差 ---------- */
let px = 0, py = 0, tx = 0, ty = 0;
addEventListener('message', (e) => { if(e.data && e.data.t === 'pointer'){ px = e.data.x; py = e.data.y; } });
addEventListener('mousemove', (e) => { px = e.clientX/innerWidth - .5; py = e.clientY/innerHeight - .5; });

resize();
addEventListener('resize', resize);

/* ---------- 主循环 ---------- */
// reduce: 静态构图——预放一团洇墨+一笔(画完格式后冻结时间)
if (reduce){ spawnBloom(); blooms[0].t = blooms[0].grow; spawnStroke(); strokes[0].t = strokes[0].draw; }
let last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;

  if (!reduce){
    bloomTimer -= dt; strokeTimer -= dt;
    if (bloomTimer <= 0 && blooms.length < CONFIG.bloomMax){ spawnBloom(); bloomTimer = pick(CONFIG.bloomEvery); }
    if (strokeTimer <= 0 && strokes.length < CONFIG.strokeMax){ spawnStroke(); strokeTimer = pick(CONFIG.strokeEvery); }
    blooms = blooms.filter(b => stepBloom(b, dt));
    strokes = strokes.filter(s => stepStroke(s, dt));
    tx += (px - tx) * CONFIG.parallaxEase;
    ty += (py - ty) * CONFIG.parallaxEase;
  }

  ctx.clearRect(0, 0, W, H);
  drawMountains();
  for(const b of blooms) drawBloom(b);
  for(const s of strokes) drawStroke(s);
})(last);
</script>
</body>
</html>
